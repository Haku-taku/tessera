[package]
name = "ui-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Presentation targets and the CPU window/surface app loop."

[dependencies]
rustc-hash.workspace = true
ui-core = { workspace = true }
ui-math = { path = "../ui-math" }
# The host-editing contract: the text shaper a formula's text is measured with.
math-core = { workspace = true }
ui-paint = { workspace = true }
ui-text = { workspace = true }
ui-text-fontique = { workspace = true }
# Frame-phase timing for the `profile` feature; absent from normal builds.
hotpath = { version = "0.30", optional = true, default-features = false }

[features]
# Use the OS font stack for the bundled examples.
system-fonts = ["ui-text-fontique/system"]
# Times each phase of one frame; the gallery's own `profile` feature turns it on.
profile = ["dep:hotpath", "hotpath/hotpath"]

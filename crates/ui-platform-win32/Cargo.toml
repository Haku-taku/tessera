[package]
name = "ui-platform-win32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Win32 window and DXGI swap chain: the engine's scene presented on Windows."

[dependencies]
ui-core = { workspace = true }
# The window draws text with the machine's own faces, as every other showcase does.
ui-platform = { workspace = true, features = ["system-fonts"] }
ui-gpu-scene = { workspace = true }
ui-gpu-d3d11 = { path = "../ui-gpu-d3d11" }

# The crate is empty off Windows: a Win32 window and a DXGI swap chain cannot exist without
# user32 and dxgi, and there is nothing to fall back to.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

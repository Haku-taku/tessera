[package]
name = "ui-platform-wayland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wayland XDG window target: wl_shm buffers presented through a real surface."

[dependencies]
ui-core = { workspace = true }
ui-paint = { workspace = true }
ui-paint-gpu = { workspace = true, optional = true }
ui-platform = { workspace = true }
ui-text = { workspace = true }
ui-text-fontique = { workspace = true }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
# wlr-layer-shell: the only portable way to ask for an overlay surface that the
# compositor places itself (no window manager, no decoration, always on top).
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
memmap2 = "0.9"
xkbcommon = "0.8"
tempfile = "3"
# Pipes and poll for the clipboard: a paste is a pipe read the event loop must not block on.
rustix = { version = "1", features = ["event", "net", "pipe"] }
# D-Bus client for the XDG portals: the settings object behind the light/dark preference, and
# the GlobalShortcuts transport. This crate is Linux's platform layer, so D-Bus is part of it;
# which hotkey transport runs is still decided at runtime.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# Frame-phase timing for the `profile` feature; absent from normal builds.
hotpath = { version = "0.30", optional = true, default-features = false }

[dev-dependencies]
libc = "0.2"
# Virtual keyboard, so `type_text` can drive a real input method without a physical one.
wayland-protocols-misc = { version = "0.3", features = ["client"] }

[features]
gpu = ["dep:ui-paint-gpu"]
# Times the present path; the gallery's own `profile` feature turns it on.
profile = ["dep:hotpath", "hotpath/hotpath", "ui-paint-gpu?/profile"]
global-hotkeys = []
default = ["global-hotkeys"]
system-fonts = ["ui-text-fontique/system", "ui-platform/system-fonts"]

[[example]]
name = "window_gpu"
required-features = ["gpu"]

[package]
name = "ui-text-fontique"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Platform-native font provider backed by fontique, plus a glyph rasterizer."

[dependencies]
ui-core = { workspace = true }
ui-text = { workspace = true }
fontique = { version = "0.12", default-features = false, features = ["std"] }
self_cell = "1"
skrifa = "0.49"
swash = "0.2"
zeno = { version = "0.3", default-features = false, features = ["std", "eval"] }

[features]
default = []
# Turn on the OS font stack. Linux uses fontconfig, Windows DirectWrite, macOS CoreText.
system = ["fontique/system"]

[package]
name = "ui-gallery"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ui-design.workspace = true
ui-core = { path = "../ui-core" }
ui-i18n = { path = "../ui-i18n" }
ui-paint = { path = "../ui-paint" }
ui-platform = { path = "../ui-platform" }
ui-style = { path = "../ui-style" }
ui-widgets = { path = "../ui-widgets" }
ui-widgets-md3 = { path = "../ui-widgets-md3" }
ui-widgets-fluent = { path = "../ui-widgets-fluent" }
ui-widgets-glass = { path = "../ui-widgets-glass" }
ui-highlight = { path = "../ui-highlight" }
ui-richtext = { path = "../ui-richtext" }
# Frame timing for the gallery only; off unless the `profile` feature is on.
hotpath = { version = "0.30", optional = true, default-features = false }

[features]
# `cargo run --release --example gallery --features profile` times the frame loop
# and prints a per-label report on exit.
profile = ["dep:hotpath", "hotpath/hotpath", "ui-platform/profile"]

[dev-dependencies]
# The material demo loads a real photo, and the gallery's wallpaper is a PNG: one decoder
# per format keeps it honest without pulling in the rest of the crate.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ui-gpu-scene = { workspace = true }
# The examples present through a real window; which backend that is depends on the target,
# and the choice lives in `ui-host` rather than in this manifest.
ui-host = { path = "../ui-host" }
